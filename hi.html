<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pro Cinematic Player</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#050505;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* Animated Background */

body::before{
content:'';
position:absolute;
width:500px;
height:500px;
background:linear-gradient(#ff3c00,#ff0080);
border-radius:50%;
filter:blur(180px);
animation:move 10s infinite alternate;
}

@keyframes move{
0%{
transform:translate(-200px,-100px);
}
100%{
transform:translate(250px,150px);
}
}

/* Player */

.player{
position:relative;
width:90%;
max-width:1100px;
border-radius:25px;
overflow:hidden;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
box-shadow:0 0 50px rgba(255,255,255,0.08);
}

/* Video */

video{
width:100%;
display:block;
background:black;
}

/* Controls */

.controls{
position:absolute;
bottom:0;
width:100%;
padding:20px;
background:linear-gradient(to top,
rgba(0,0,0,0.9),
transparent);

transition:0.3s;
}

/* Progress */

.progress-area{
height:5px;
background:rgba(255,255,255,0.2);
border-radius:20px;
cursor:pointer;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(to right,#ff3c00,#ff0080);
border-radius:20px;
}

/* Buttons */

.controls-row{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:15px;
}

.left-controls,
.right-controls{
display:flex;
align-items:center;
gap:15px;
}

button{
background:none;
border:none;
color:white;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.2);
color:#ff3c00;
}

/* Time */

.time{
color:white;
font-size:14px;
}

/* Volume */

.volume{
width:90px;
accent-color:#ff3c00;
}

/* Quality Menu */

.quality-menu{
position:absolute;
bottom:80px;
right:20px;
background:rgba(0,0,0,0.8);
border-radius:10px;
display:none;
flex-direction:column;
overflow:hidden;
}

.quality-menu button{
padding:10px 20px;
text-align:left;
font-size:14px;
}

.quality-menu button:hover{
background:#ff3c00;
color:white;
}

/* External Player Buttons */

.external{
position:absolute;
top:20px;
right:20px;
display:flex;
gap:10px;
}

.external a{
text-decoration:none;
padding:10px 14px;
border-radius:12px;
background:rgba(255,255,255,0.08);
color:white;
font-size:14px;
backdrop-filter:blur(10px);
transition:0.3s;
}

.external a:hover{
background:#ff3c00;
transform:translateY(-3px);
}

/* Mobile */

@media(max-width:768px){

.controls{
padding:12px;
}

button{
font-size:16px;
}

.external{
flex-wrap:wrap;
}

}

</style>
</head>
<body>

<div class="player" id="player">

<!-- External Players -->

<div class="external">

<a id="vlcBtn">
<i class="fa-solid fa-play"></i> VLC
</a>

<a id="mxBtn">
<i class="fa-solid fa-bolt"></i> MX
</a>

<a id="kmBtn">
<i class="fa-solid fa-film"></i> KM
</a>

</div>

<video id="video"
src="https://common-clownfish-animetn-73108cff.koyeb.app/dl/1273/Easygoing+Territory+Defense+by+the+Optimistic+Lord+S01E01+72.mkv?hash=AgAD8C"></video>

<div class="controls">

<div class="progress-area" id="progressArea">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="controls-row">

<div class="left-controls">

<button id="play">
<i class="fa-solid fa-play"></i>
</button>

<span class="time" id="time">
0:00 / 0:00
</span>

</div>

<div class="right-controls">

<input type="range"
class="volume"
min="0"
max="1"
step="0.1"
value="1"
id="volume">

<button id="qualityBtn">
1080p
</button>

<button id="fullscreen">
<i class="fa-solid fa-expand"></i>
</button>

</div>

</div>

</div>

<div class="quality-menu" id="qualityMenu">

<button data-quality="360">
360p
</button>

<button data-quality="720">
720p
</button>

<button data-quality="1080">
1080p
</button>

</div>

</div>

<script>

const video = document.getElementById('video');
const playBtn = document.getElementById('play');
const progressBar = document.getElementById('progressBar');
const progressArea = document.getElementById('progressArea');
const time = document.getElementById('time');
const volume = document.getElementById('volume');
const fullscreen = document.getElementById('fullscreen');
const qualityBtn = document.getElementById('qualityBtn');
const qualityMenu = document.getElementById('qualityMenu');

const VIDEO_URL = "YOUR_VIDEO_URL.mp4";

/* Play Pause */

playBtn.onclick = ()=>{

if(video.paused){

video.play();

playBtn.innerHTML =
'<i class="fa-solid fa-pause"></i>';

}else{

video.pause();

playBtn.innerHTML =
'<i class="fa-solid fa-play"></i>';

}

};

/* Progress */

video.ontimeupdate = ()=>{

let percent =
(video.currentTime / video.duration)*100;

progressBar.style.width = percent + '%';

time.innerHTML =
format(video.currentTime)
+
' / ' +
format(video.duration);

};

function format(sec){

if(isNaN(sec)) return "0:00";

let m = Math.floor(sec/60);

let s = Math.floor(sec%60);

if(s<10) s = '0'+s;

return `${m}:${s}`;

}

/* Seek */

progressArea.onclick = (e)=>{

let width = progressArea.clientWidth;

let clickX = e.offsetX;

video.currentTime =
(clickX / width) * video.duration;

};

/* Volume */

volume.oninput = ()=>{

video.volume = volume.value;

};

/* Fullscreen */

fullscreen.onclick = ()=>{

if(!document.fullscreenElement){

player.requestFullscreen();

}else{

document.exitFullscreen();

}

};

/* Quality Menu */

qualityBtn.onclick = ()=>{

qualityMenu.style.display =
qualityMenu.style.display === 'flex'
? 'none'
: 'flex';

};

/* External Players */

document.getElementById('vlcBtn').href =
`vlc://${VIDEO_URL}`;

document.getElementById('mxBtn').href =
`intent:${VIDEO_URL}#Intent;package=com.mxtech.videoplayer.ad;end`;

document.getElementById('kmBtn').href =
`intent:${VIDEO_URL}#Intent;package=com.kmplayer;end`;

</script>

</body>
</html>
